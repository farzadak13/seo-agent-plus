# A throwaway WordPress with the HoshyarSEO Connector, for the live Stage 37/38
# test (tests/integration/test_wordpress_live.py).
#
# Separate from the root docker-compose.yml on purpose: `docker compose up -d`
# there starts only PostgreSQL. Start this one with
#
#   python scripts/local_wordpress.py up
#
# which also installs WordPress, activates the plugin from this checkout and
# writes the test settings to .env.wordpress. `... down` removes it and its data.
#
# Bound to 127.0.0.1, reachable from nowhere else. The passwords below are for
# this disposable database only.

name: seoagent-wordpress

services:
  db:
    image: mariadb:11.4.8
    environment:
      MARIADB_DATABASE: wordpress
      MARIADB_USER: wordpress
      MARIADB_PASSWORD: wordpress_local_test
      MARIADB_RANDOM_ROOT_PASSWORD: "1"
    volumes:
      - db:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 3s
      timeout: 3s
      retries: 40

  wordpress:
    image: wordpress:6.8.3-php8.3-apache
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "127.0.0.1:58080:80"
    environment: &wp-env
      WORDPRESS_DB_HOST: db
      WORDPRESS_DB_NAME: wordpress
      WORDPRESS_DB_USER: wordpress
      WORDPRESS_DB_PASSWORD: wordpress_local_test
      # Application passwords need HTTPS, except on a site that says it is local.
      WORDPRESS_CONFIG_EXTRA: |
        define('WP_ENVIRONMENT_TYPE', 'local');
    volumes:
      - html:/var/www/html
      # The plugin as it is in this checkout, so the test runs the code under review.
      - ../../integrations/wordpress/hoshyarseo-connector:/var/www/html/wp-content/plugins/hoshyarseo-connector:ro

  cli:
    image: wordpress:cli-2.12.0-php8.3
    profiles: ["tools"]
    depends_on:
      - wordpress
    user: "33:33"
    environment: *wp-env
    volumes:
      - html:/var/www/html
      - ../../integrations/wordpress/hoshyarseo-connector:/var/www/html/wp-content/plugins/hoshyarseo-connector:ro

volumes:
  db:
  html:
