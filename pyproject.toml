[project]
name = "ai-seo-agent"
version = "0.1.0"
description = "AI SEO Agent - deterministic SEO decision engine"
# The suite runs green on 3.11 and 3.12 as well; pinning to 3.14 was a
# statement of the development machine, not of what the code needs, and it
# stopped the application installing on the Ubuntu 24.04 server entirely.
requires-python = ">=3.11,<3.15"
dependencies = [
    "pydantic>=2,<3",
    "numpy>=2,<3",
    "fastapi>=0.115,<1",
    "uvicorn>=0.30,<1",
    "httpx>=0.27,<1",
    "psycopg[binary]>=3.2,<4",
    # Google auth is delegated rather than hand-rolled: clock skew, key formats
    # and expiry semantics are where a home-grown signer is quietly wrong.
    "google-auth>=2.30,<3",
    "requests>=2.32,<3",
    # AES-GCM for customers' site credentials. Already pulled in by
    # google-auth; named here because the vault depends on it directly.
    "cryptography>=42",
]

[dependency-groups]
dev = ["pytest>=9,<10"]

[tool.setuptools.packages.find]
include = ["app*"]
exclude = ["tests*", "db*"]

[tool.pytest.ini_options]
testpaths=["tests"]
pythonpath=["."]
addopts="-ra"
markers=[
  "integration: tests requiring external services or API credentials",
]
