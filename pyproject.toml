[project]
name = "ai-seo-agent"
version = "0.1.0"
description = "AI SEO Agent - deterministic SEO decision engine"
requires-python = ">=3.14,<3.15"
dependencies = [
    "pydantic>=2,<3",
    "numpy>=2,<3",
    "fastapi>=0.115,<1",
    "uvicorn>=0.30,<1",
    "httpx>=0.27,<1",
    "psycopg[binary]>=3.2,<4",
    # Google auth is delegated rather than hand-rolled: clock skew, key formats
    # and expiry semantics are where a home-grown signer is quietly wrong.
    "google-auth>=2.30,<3",
    "requests>=2.32,<3",
]

[dependency-groups]
dev = ["pytest>=9,<10"]

[tool.setuptools.packages.find]
include = ["app*"]
exclude = ["tests*", "db*"]

[tool.pytest.ini_options]
testpaths=["tests"]
pythonpath=["."]
addopts="-ra"
markers=[
  "integration: tests requiring external services or API credentials",
]
