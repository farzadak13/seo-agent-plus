# The dashboard (frontend/), served as static files from the live release, on
# the same origin as the API so the session cookie and CSRF token just work.
# Included from the HTTPS server block; installed by frontend-setup.sh.
#
# Script and style only from these files: nothing on the page can be loaded
# from elsewhere or run from an injected string. no-cache means "ask first":
# after a release the browser gets the new files, and until then a 304.

location = /app {
    return 301 /app/;
}

location /app/ {
    alias /opt/seoagent/current/frontend/;
    index index.html;
    add_header Content-Security-Policy "default-src 'none'; script-src 'self'; style-src 'self'; font-src 'self'; img-src 'self'; connect-src 'self'; form-action 'self'; base-uri 'none'; frame-ancestors 'none'" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "same-origin" always;
    add_header Cache-Control "no-cache" always;
}
